[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omat-api"
version = "0.1.0"
description = "FastAPI service for OMAT-SE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "opensearch-py>=2.7",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
