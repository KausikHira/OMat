[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omat-workers"
version = "0.1.0"
description = "Async workers for OMAT-SE (phase 2)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

# Kafka client is deliberately absent until phase 2. Add confluent-kafka (or
# aiokafka) together with the consumer implementation so the dependency is real.

[tool.setuptools.packages.find]
where = ["src"]
