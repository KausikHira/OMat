<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMAT-SE API reference</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
    <style>
      /* Scalar has no config flag for its footer credit; hide the generated link. */
      a[href*="utm_source=powered-by"] {
        display: none !important;
      }

      /* Links back to the docs home, MCP reference, and app. */
      #docs-links {
        position: fixed;
        bottom: 14px;
        left: 14px;
        z-index: 100;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #docs-links a {
        color: var(--scalar-color-2, #6b7280);
        text-decoration: none;
        opacity: 0.75;
      }

      #docs-links a:hover,
      #docs-links a:focus-visible {
        opacity: 1;
        text-decoration: underline;
      }

      /* On narrow screens the sidebar collapses and the links would cover content. */
      @media (max-width: 767px) {
        #docs-links {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <nav id="docs-links" aria-label="Documentation">
      <a href="../">Docs</a>
      <a href="../mcp/">MCP</a>
      <a href="https://omat-se.vercel.app">App &#8599;</a>
    </nav>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference("#app", {
        url: "./openapi.json",
        hideClientButton: true,
        showDeveloperTools: "never",
      });
    </script>
  </body>
</html>
