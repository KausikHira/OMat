[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omat-mcp"
version = "0.1.0"
description = "MCP server exposing OMAT-SE search tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]
