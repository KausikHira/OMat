# Tooling configuration only. Python dependencies live in the per-package
# pyproject.toml files and are installed through requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "packages"]
# The GSC notebook under apps/web/analysis is a research artifact, not
# application code, and must not gate CI.
extend-exclude = ["apps/web/analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: function-call defaults ARE the FastAPI Depends() idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["omat_core", "omat_api", "omat_mcp", "omat_workers", "omat_ingest"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["apps", "packages"]
