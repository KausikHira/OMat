name: docs

# Generate the OpenAPI schema from FastAPI and publish the API + MCP reference.
#
# Setup: repository Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The site is published as:
#   /       landing page (docs/index.html)
#   /api/   Scalar shell + generated openapi.json
#   /mcp/   MCP server reference (docs/mcp/index.html)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "apps/mcp/**"
      - "packages/py-core/**"
      - "docs/api/**"
      - "docs/mcp/**"
      - "docs/index.html"
      - "docs/site.css"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/py-core/pyproject.toml

      - name: Install API packages
        run: pip install -e ./packages/py-core -e ./apps/api

      - name: Build static reference
        run: |
          mkdir -p _site/api _site/mcp
          python - <<'PY'
          import json
          from omat_api.main import app

          with open("_site/api/openapi.json", "w", encoding="utf-8") as spec:
              json.dump(app.openapi(), spec, indent=2)
          PY
          cp docs/index.html docs/site.css _site/
          cp docs/api/index.html docs/api/favicon.ico docs/api/favicon.svg _site/api/
          cp docs/mcp/index.html _site/mcp/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
