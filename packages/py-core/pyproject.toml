[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omat-core"
version = "0.1.0"
description = "Shared domain models, normalization, and OpenSearch queries for OMAT-SE"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "opensearch-py>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]
